name = "masterleaguef1"
compatibility_date = "2026-05-23"

# Domínios customizados — o Wrangler cria/atualiza o DNS no Cloudflare.
# Necessário para links antigos (WhatsApp/OAuth) com www.masterleaguef1.com.br
[[routes]]
pattern = "masterleaguef1.com.br"
custom_domain = true

[[routes]]
pattern = "www.masterleaguef1.com.br"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
